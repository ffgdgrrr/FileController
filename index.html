<!DOCTYPE html>
<html>
<head>
    <title>Electron 文件操作器</title>
    <style>
        /* 保持原有样式不变 */
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; }
        .path-group { display: flex; gap: 10px; }
        .path-input { flex: 1; }
        button.choose-btn { padding: 8px 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Electron 文件操作器</h2>

        <!-- 操作类型下拉列表 -->
        <div class="form-group">
            <label>选择操作类型：</label>
            <select id="operationType">
                <option value="replace">替换文件（目标存在则替换）</option>
                <option value="delete">删除文件（从目标删除）</option>
                <option value="copy">复制文件（仅复制新增）</option>
            </select>
        </div>

        <!-- 路径输入 -->
        <div class="form-group">
            <label>源文件夹路径：</label>
            <div class="path-group">
                <input type="text" id="sourcePath" class="path-input" readonly>
                <button class="choose-btn" onclick="selectSourceFolder()">选择文件夹</button>
            </div>
        </div>

        <div class="form-group">
            <label>目标文件夹路径：</label>
            <div class="path-group">
                <input type="text" id="targetPath" class="path-input" readonly>
                <button class="choose-btn" onclick="selectTargetFolder()">选择文件夹</button>
            </div>
        </div>

        <button onclick="executeOperation()">执行操作</button>
    </div>

    <script>
        // 引入 Electron 模块
        const { ipcRenderer } = require('electron');

        // 选择源文件夹
        async function selectSourceFolder() {
            const path = await ipcRenderer.invoke('select-folder');
            if (path) document.getElementById('sourcePath').value = path;
        }

        // 选择目标文件夹
        async function selectTargetFolder() {
            const path = await ipcRenderer.invoke('select-folder');
            if (path) document.getElementById('targetPath').value = path;
        }

        // 执行操作
        async function executeOperation() {
            const operation = document.getElementById('operationType').value;
            const source = document.getElementById('sourcePath').value;
            const target = document.getElementById('targetPath').value;

            if (!source || !target) {
                alert('请先选择文件夹');
                return;
            }

            try {
                const result = await ipcRenderer.invoke('perform-operation', {
                    operation,
                    source,
                    target
                });

                alert(result || '操作执行成功！');
            } catch (error) {
                alert(`操作失败: ${error.message}`);
            }
        }
    </script>
</body>
</html>
